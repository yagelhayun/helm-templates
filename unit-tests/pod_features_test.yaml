suite: pod-level features — initContainers, sidecars, probes, annotations, topology, serviceAccount, terminationGracePeriodSeconds, revisionHistoryLimit
templates:
  - templates/deployment.yaml
tests:
  - it: renders initContainer
    values:
      - ../test-values/common.values.yaml
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: db-migration

  - it: renders sidecar as second container
    values:
      - ../test-values/common.values.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[1].name
          value: log-shipper

  - it: renders readiness probe
    values:
      - ../test-values/common.values.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /health

  - it: renders liveness probe with configured thresholds
    values:
      - ../test-values/common.values.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.failureThreshold
          value: 1
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.periodSeconds
          value: 15

  - it: renders startup probe
    values:
      - ../test-values/common.values.yaml
    asserts:
      - exists:
          path: spec.template.spec.containers[0].startupProbe

  - it: defaults serviceAccount to default
    values:
      - ../test-values/minimal.values.yaml
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: default

  - it: uses configured serviceAccount
    values:
      - ../test-values/minimal.values.yaml
    set:
      serviceAccount.name: my-service-account
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: my-service-account

  - it: defaults terminationGracePeriodSeconds to 30
    values:
      - ../test-values/minimal.values.yaml
    asserts:
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 30

  - it: uses configured terminationGracePeriodSeconds
    values:
      - ../test-values/minimal.values.yaml
    set:
      terminationGracePeriodSeconds: 60
    asserts:
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 60

  - it: defaults revisionHistoryLimit to 1
    values:
      - ../test-values/minimal.values.yaml
    asserts:
      - equal:
          path: spec.revisionHistoryLimit
          value: 1

  - it: uses configured revisionHistoryLimit
    values:
      - ../test-values/minimal.values.yaml
    set:
      revisionHistoryLimit: 3
    asserts:
      - equal:
          path: spec.revisionHistoryLimit
          value: 3

  - it: renders default topology spread constraints when not configured
    values:
      - ../test-values/minimal.values.yaml
    asserts:
      - contains:
          path: spec.template.spec.topologySpreadConstraints
          content:
            maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: ScheduleAnyway
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: templates
      - contains:
          path: spec.template.spec.topologySpreadConstraints
          content:
            maxSkew: 1
            topologyKey: topology.kubernetes.io/zone
            whenUnsatisfiable: ScheduleAnyway
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: templates

  - it: omits topologySpreadConstraints when set to empty list
    values:
      - ../test-values/minimal.values.yaml
    set:
      topologySpreadConstraints: []
    asserts:
      - notExists:
          path: spec.template.spec.topologySpreadConstraints

  - it: renders custom topology spread constraint
    values:
      - ../test-values/custom-topology.values.yaml
    asserts:
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].maxSkew
          value: 2
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].whenUnsatisfiable
          value: DoNotSchedule

  # ── nodeSelector ─────────────────────────────────────────────────────────────

  - it: renders nodeSelector
    values:
      - ../test-values/scheduling.values.yaml
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector.disktype
          value: ssd

  - it: omits nodeSelector when not set
    values:
      - ../test-values/minimal.values.yaml
    asserts:
      - notExists:
          path: spec.template.spec.nodeSelector

  # ── tolerations ───────────────────────────────────────────────────────────────

  - it: renders tolerations
    values:
      - ../test-values/scheduling.values.yaml
    asserts:
      - contains:
          path: spec.template.spec.tolerations
          content:
            key: dedicated
            operator: Equal
            value: gpu
            effect: NoSchedule

  - it: renders toleration with tolerationSeconds
    values:
      - ../test-values/scheduling.values.yaml
    asserts:
      - equal:
          path: spec.template.spec.tolerations[1].tolerationSeconds
          value: 300

  - it: omits tolerations when not set
    values:
      - ../test-values/minimal.values.yaml
    asserts:
      - notExists:
          path: spec.template.spec.tolerations

  # ── affinity ──────────────────────────────────────────────────────────────────

  - it: maps nodeAffinity.required to requiredDuringSchedulingIgnoredDuringExecution
    values:
      - ../test-values/scheduling.values.yaml
    asserts:
      - equal:
          path: spec.template.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms[0].matchExpressions[0].key
          value: topology.kubernetes.io/zone
      - equal:
          path: spec.template.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms[0].matchExpressions[0].operator
          value: In
      - contains:
          path: spec.template.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms[0].matchExpressions[0].values
          content: us-east-1a

  - it: maps nodeAffinity.preferred to preferredDuringSchedulingIgnoredDuringExecution
    values:
      - ../test-values/scheduling.values.yaml
    asserts:
      - equal:
          path: spec.template.spec.affinity.nodeAffinity.preferredDuringSchedulingIgnoredDuringExecution[0].weight
          value: 50
      - equal:
          path: spec.template.spec.affinity.nodeAffinity.preferredDuringSchedulingIgnoredDuringExecution[0].preference.matchExpressions[0].key
          value: kubernetes.io/arch

  - it: maps podAntiAffinity.preferred and injects labelSelector
    values:
      - ../test-values/scheduling.values.yaml
    asserts:
      - equal:
          path: spec.template.spec.affinity.podAntiAffinity.preferredDuringSchedulingIgnoredDuringExecution[0].weight
          value: 100
      - equal:
          path: spec.template.spec.affinity.podAntiAffinity.preferredDuringSchedulingIgnoredDuringExecution[0].podAffinityTerm.topologyKey
          value: kubernetes.io/hostname
      - equal:
          path: spec.template.spec.affinity.podAntiAffinity.preferredDuringSchedulingIgnoredDuringExecution[0].podAffinityTerm.labelSelector.matchLabels["app.kubernetes.io/name"]
          value: templates

  - it: maps podAntiAffinity.required and injects labelSelector
    values:
      - ../test-values/scheduling.values.yaml
    asserts:
      - equal:
          path: spec.template.spec.affinity.podAntiAffinity.requiredDuringSchedulingIgnoredDuringExecution[0].topologyKey
          value: topology.kubernetes.io/zone
      - equal:
          path: spec.template.spec.affinity.podAntiAffinity.requiredDuringSchedulingIgnoredDuringExecution[0].labelSelector.matchLabels["app.kubernetes.io/name"]
          value: templates

  - it: omits affinity when not set
    values:
      - ../test-values/minimal.values.yaml
    asserts:
      - notExists:
          path: spec.template.spec.affinity

  - it: schema rejects unknown field in affinity.nodeAffinity
    values:
      - ../test-values/minimal.values.yaml
    set:
      affinity.nodeAffinity.badField: foo
    asserts:
      - failedTemplate: {}

  - it: schema rejects unknown field in affinity.podAntiAffinity
    values:
      - ../test-values/minimal.values.yaml
    set:
      affinity.podAntiAffinity.badField: foo
    asserts:
      - failedTemplate: {}

  - it: schema rejects invalid nodeAffinity matchExpression operator
    values:
      - ../test-values/minimal.values.yaml
    set:
      affinity.nodeAffinity.required[0].key: foo
      affinity.nodeAffinity.required[0].operator: BadOp
    asserts:
      - failedTemplate: {}

  - it: schema rejects podAntiAffinity preferred entry missing topologyKey
    values:
      - ../test-values/minimal.values.yaml
    set:
      affinity.podAntiAffinity.preferred[0].weight: 100
    asserts:
      - failedTemplate: {}

  - it: schema rejects nodeAffinity with neither required nor preferred
    values:
      - ../test-values/minimal.values.yaml
    set:
      affinity.nodeAffinity: {}
    asserts:
      - failedTemplate: {}

  - it: schema rejects podAntiAffinity with neither required nor preferred
    values:
      - ../test-values/minimal.values.yaml
    set:
      affinity.podAntiAffinity: {}
    asserts:
      - failedTemplate: {}

  # ── podSecurityContext ────────────────────────────────────────────────────────

  - it: renders podSecurityContext
    values:
      - ../test-values/scheduling.values.yaml
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 1000
      - equal:
          path: spec.template.spec.securityContext.fsGroup
          value: 2000

  - it: renders podSecurityContext with seccompProfile
    values:
      - ../test-values/scheduling.values.yaml
    asserts:
      - equal:
          path: spec.template.spec.securityContext.seccompProfile.type
          value: RuntimeDefault

  - it: omits securityContext when podSecurityContext not set
    values:
      - ../test-values/minimal.values.yaml
    asserts:
      - notExists:
          path: spec.template.spec.securityContext

  # ── containerSecurityContext ──────────────────────────────────────────────────

  - it: renders containerSecurityContext on main container
    values:
      - ../test-values/scheduling.values.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - contains:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          content: ALL

  - it: omits securityContext on container when not set
    values:
      - ../test-values/minimal.values.yaml
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].securityContext

  # ── priorityClassName ─────────────────────────────────────────────────────────

  - it: renders priorityClassName
    values:
      - ../test-values/scheduling.values.yaml
    asserts:
      - equal:
          path: spec.template.spec.priorityClassName
          value: high-priority

  - it: omits priorityClassName when not set
    values:
      - ../test-values/minimal.values.yaml
    asserts:
      - notExists:
          path: spec.template.spec.priorityClassName

  # ── Schema validation ────────────────────────────────────────────────────────

  - it: schema rejects probe with both httpGet and exec
    values:
      - ../test-values/minimal.values.yaml
    set:
      probes.readiness.httpGet.path: /health
      probes.readiness.exec.command[0]: /bin/check
    asserts:
      - failedTemplate: {}

  - it: schema rejects probe with neither httpGet nor exec
    values:
      - ../test-values/minimal.values.yaml
    set:
      probes.readiness.failureThreshold: 3
    asserts:
      - failedTemplate: {}

  - it: schema rejects failureThreshold below 1
    values:
      - ../test-values/minimal.values.yaml
    set:
      probes.readiness.httpGet.path: /health
      probes.readiness.failureThreshold: 0
    asserts:
      - failedTemplate: {}

  - it: schema rejects revisionHistoryLimit of 0
    values:
      - ../test-values/minimal.values.yaml
    set:
      revisionHistoryLimit: 0
    asserts:
      - failedTemplate: {}

  - it: schema rejects terminationGracePeriodSeconds below 0
    values:
      - ../test-values/minimal.values.yaml
    set:
      terminationGracePeriodSeconds: -1
    asserts:
      - failedTemplate: {}

  - it: schema rejects topologySpreadConstraints maxSkew below 1
    values:
      - ../test-values/minimal.values.yaml
    set:
      topologySpreadConstraints[0].maxSkew: 0
      topologySpreadConstraints[0].topologyKey: kubernetes.io/hostname
      topologySpreadConstraints[0].whenUnsatisfiable: ScheduleAnyway
    asserts:
      - failedTemplate: {}

  - it: schema rejects invalid topologySpreadConstraints whenUnsatisfiable
    values:
      - ../test-values/minimal.values.yaml
    set:
      topologySpreadConstraints[0].maxSkew: 1
      topologySpreadConstraints[0].topologyKey: kubernetes.io/hostname
      topologySpreadConstraints[0].whenUnsatisfiable: Never
    asserts:
      - failedTemplate: {}

  - it: schema rejects invalid toleration operator
    values:
      - ../test-values/minimal.values.yaml
    set:
      tolerations[0].operator: Invalid
    asserts:
      - failedTemplate: {}

  - it: schema rejects invalid toleration effect
    values:
      - ../test-values/minimal.values.yaml
    set:
      tolerations[0].effect: BadEffect
    asserts:
      - failedTemplate: {}

  - it: schema rejects unknown field in containerSecurityContext
    values:
      - ../test-values/minimal.values.yaml
    set:
      containerSecurityContext.unknownFieldDuplicate: true
    asserts:
      - failedTemplate: {}

  - it: schema rejects invalid podSecurityContext fsGroupChangePolicy
    values:
      - ../test-values/minimal.values.yaml
    set:
      podSecurityContext.fsGroupChangePolicy: Invalid
    asserts:
      - failedTemplate: {}

  - it: schema rejects invalid seccompProfile type
    values:
      - ../test-values/minimal.values.yaml
    set:
      podSecurityContext.seccompProfile.type: Bad
    asserts:
      - failedTemplate: {}

  - it: schema rejects negative runAsUser
    values:
      - ../test-values/minimal.values.yaml
    set:
      podSecurityContext.runAsUser: -1
    asserts:
      - failedTemplate: {}

  - it: schema rejects containerSecurityContext with unknown field
    values:
      - ../test-values/minimal.values.yaml
    set:
      containerSecurityContext.notARealField: true
    asserts:
      - failedTemplate: {}
