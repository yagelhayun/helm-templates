suite: cronJob opt-in and configuration
templates:
  - templates/cronjob.yaml
tests:
  - it: does not render when cronJob.enabled is false
    values:
      - ../test-values/common.values.yaml
    set:
      cronJob.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: renders a CronJob when cronJob.enabled is true
    values:
      - ../test-values/common.values.yaml
    set:
      cronJob.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: CronJob

  - it: uses the configured schedule
    values:
      - ../test-values/common.values.yaml
    set:
      cronJob.enabled: true
      # cronJob.schedule=@hourly from common.values.yaml
    asserts:
      - equal:
          path: spec.schedule
          value: "@hourly"

  - it: defaults concurrencyPolicy to Forbid when not set
    values:
      - ../test-values/minimal.values.yaml
    set:
      cronJob.enabled: true
      cronJob.schedule: "0 * * * *"
      # no concurrencyPolicy set
    asserts:
      - equal:
          path: spec.concurrencyPolicy
          value: Forbid

  - it: defaults suspend to false when not set
    values:
      - ../test-values/common.values.yaml
    set:
      cronJob.enabled: true
    asserts:
      - equal:
          path: spec.suspend
          value: false

  - it: sets suspend to true when configured
    values:
      - ../test-values/common.values.yaml
    set:
      cronJob.enabled: true
      cronJob.suspend: true
    asserts:
      - equal:
          path: spec.suspend
          value: true

  # ── Schema validation ────────────────────────────────────────────────────────

  - it: schema rejects non-boolean suspend
    values:
      - ../test-values/minimal.values.yaml
    set:
      cronJob.enabled: true
      cronJob.schedule: "0 * * * *"
      cronJob.suspend: "yes"
    asserts:
      - failedTemplate: {}

  - it: accepts a standard 5-field schedule
    values:
      - ../test-values/minimal.values.yaml
    set:
      cronJob.enabled: true
      cronJob.schedule: "0 2 * * 1-5"
    asserts:
      - hasDocuments:
          count: 1

  - it: accepts @hourly macro
    values:
      - ../test-values/minimal.values.yaml
    set:
      cronJob.enabled: true
      cronJob.schedule: "@hourly"
    asserts:
      - hasDocuments:
          count: 1

  - it: schema rejects a 6-field schedule (year not supported)
    values:
      - ../test-values/minimal.values.yaml
    set:
      cronJob.enabled: true
      cronJob.schedule: "0 0 * * * 2025"
    asserts:
      - failedTemplate: {}

  - it: schema rejects an invalid schedule string
    values:
      - ../test-values/minimal.values.yaml
    set:
      cronJob.enabled: true
      cronJob.schedule: "not-a-cron"
    asserts:
      - failedTemplate: {}

  - it: schema rejects unknown @ macro
    values:
      - ../test-values/minimal.values.yaml
    set:
      cronJob.enabled: true
      cronJob.schedule: "@reboot"
    asserts:
      - failedTemplate: {}

  - it: schema rejects cronJob.enabled true without schedule
    values:
      - ../test-values/minimal.values.yaml
    set:
      cronJob.enabled: true
    asserts:
      - failedTemplate: {}

  - it: schema rejects invalid concurrencyPolicy
    values:
      - ../test-values/minimal.values.yaml
    set:
      cronJob.enabled: true
      cronJob.schedule: "0 * * * *"
      cronJob.concurrencyPolicy: Invalid
    asserts:
      - failedTemplate: {}

  - it: schema rejects negative successfulJobsHistory
    values:
      - ../test-values/minimal.values.yaml
    set:
      cronJob.enabled: true
      cronJob.schedule: "0 * * * *"
      cronJob.successfulJobsHistory: -1
    asserts:
      - failedTemplate: {}

  - it: schema rejects negative failedJobsHistory
    values:
      - ../test-values/minimal.values.yaml
    set:
      cronJob.enabled: true
      cronJob.schedule: "0 * * * *"
      cronJob.failedJobsHistory: -1
    asserts:
      - failedTemplate: {}
