suite: configMap opt-in and region merging
templates:
  - templates/configmap.yaml
tests:
  - it: does not render when configMap.enabled is false
    values:
      - ../test-values/common.values.yaml
    set:
      configMap.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: renders a ConfigMap when configMap.enabled is true
    values:
      - ../test-values/common.values.yaml
    set:
      configMap.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ConfigMap

  - it: includes root-level data keys
    values:
      - ../test-values/common.values.yaml
    set:
      configMap.enabled: true
    # configMap.data.APP_ENV=staging defined at root level
    asserts:
      - equal:
          path: data.APP_ENV
          value: staging

  - it: applies region-specific data key override
    values:
      - ../test-values/common.values.yaml
    set:
      configMap.enabled: true
      # global.region=us-east-1; regions.us-east-1.configMap.data.ENDPOINT=storage.us-east-1.example.com
    asserts:
      - equal:
          path: data.ENDPOINT
          value: storage.us-east-1.example.com

  - it: picks the correct region override for a different region
    values:
      - ../test-values/common.values.yaml
    set:
      configMap.enabled: true
      global.region: us-west-1
    asserts:
      - equal:
          path: data.ENDPOINT
          value: storage.us-west-1.example.com

  # ── Schema validation ────────────────────────────────────────────────────────

  - it: schema rejects configMap.enabled true without data
    values:
      - ../test-values/minimal.values.yaml
    set:
      configMap.enabled: true
    asserts:
      - failedTemplate: {}

  - it: schema rejects unknown property in configMap
    values:
      - ../test-values/minimal.values.yaml
    set:
      configMap.enabled: false
      configMap.unknown: value
    asserts:
      - failedTemplate: {}

  # ── Schema validation: configMap.as ──────────────────────────────────────────

  - it: schema rejects as volume without mountPath
    values:
      - ../test-values/minimal.values.yaml
    set:
      configMap.enabled: true
      configMap.as: volume
      configMap.data.KEY: value
    asserts:
      - failedTemplate: {}

  - it: schema rejects invalid as value
    values:
      - ../test-values/minimal.values.yaml
    set:
      configMap.enabled: false
      configMap.as: file
    asserts:
      - failedTemplate: {}

  - it: schema rejects mountPath without as volume
    values:
      - ../test-values/minimal.values.yaml
    set:
      configMap.enabled: true
      configMap.data.KEY: value
      configMap.mountPath: /etc/config
    asserts:
      - failedTemplate: {}

  - it: schema rejects mountPath with as env
    values:
      - ../test-values/minimal.values.yaml
    set:
      configMap.enabled: true
      configMap.as: env
      configMap.data.KEY: value
      configMap.mountPath: /etc/config
    asserts:
      - failedTemplate: {}
