suite: deployment strategy
templates:
  - templates/deployment.yaml
tests:
  - it: defaults to RollingUpdate with 25% maxUnavailable
    values:
      - ../test-values/minimal.values.yaml
    asserts:
      - equal:
          path: spec.strategy.type
          value: RollingUpdate
      - equal:
          path: spec.strategy.rollingUpdate.maxUnavailable
          value: "25%"
      - equal:
          path: spec.strategy.rollingUpdate.maxSurge
          value: "25%"

  - it: uses Recreate when configured
    values:
      - ../test-values/minimal.values.yaml
    set:
      strategy.type: Recreate
    asserts:
      - equal:
          path: spec.strategy.type
          value: Recreate
      - notExists:
          path: spec.strategy.rollingUpdate

  - it: uses custom maxSurge and maxUnavailable
    values:
      - ../test-values/minimal.values.yaml
    set:
      strategy.maxUnavailable: "0"
      strategy.maxSurge: 1
    asserts:
      - equal:
          path: spec.strategy.rollingUpdate.maxUnavailable
          value: "0"
      - equal:
          path: spec.strategy.rollingUpdate.maxSurge
          value: "1"

  # ── Schema validation ────────────────────────────────────────────────────────

  - it: schema rejects invalid strategy.type
    values:
      - ../test-values/minimal.values.yaml
    set:
      strategy.type: BlueGreen
    asserts:
      - failedTemplate: {}

  - it: schema rejects negative strategy.partition
    values:
      - ../test-values/minimal.values.yaml
    set:
      strategy.partition: -1
    asserts:
      - failedTemplate: {}

  - it: schema rejects strategy.partition on Deployment
    values:
      - ../test-values/minimal.values.yaml
    set:
      strategy.partition: 1
    asserts:
      - failedTemplate: {}

  - it: schema rejects strategy.partition on DaemonSet
    values:
      - ../test-values/minimal.values.yaml
    set:
      workload.type: DaemonSet
      strategy.partition: 1
    asserts:
      - failedTemplate: {}
