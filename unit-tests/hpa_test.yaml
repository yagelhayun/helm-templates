suite: HPA opt-in and activeRegion suppression
templates:
  - templates/hpa.yaml
tests:
  - it: does not render when hpa.enabled is false
    values:
      - ../test-values/common.values.yaml
    # hpa.enabled=false in common.values.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: does not render when hpa.enabled is true but activeRegion is set
    values:
      - ../test-values/common.values.yaml
      - ../test-values/prod.values.yaml
    set:
      hpa.enabled: true
      # activeRegion=us-east-1 from common.values.yaml → HPA suppressed
    asserts:
      - hasDocuments:
          count: 0

  - it: renders an HPA when hpa.enabled is true and activeRegion is not set
    values:
      - ../test-values/common.values.yaml
      - ../test-values/prod.values.yaml
    set:
      hpa.enabled: true
      activeRegion: ""
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: HorizontalPodAutoscaler
      - equal:
          path: spec.maxReplicas
          value: 4
