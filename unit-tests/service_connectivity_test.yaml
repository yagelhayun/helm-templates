suite: helm test — service connectivity pod
templates:
  - templates/tests/service-connectivity.yaml
tests:
  - it: does not render when service.enabled is false
    values:
      - test-values/common.values.yaml
    set:
      service.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: renders a test Pod when service.enabled is true
    values:
      - test-values/common.values.yaml
    set:
      service.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Pod

  - it: has the helm test hook annotation
    values:
      - test-values/common.values.yaml
    set:
      service.enabled: true
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: test

  - it: targets the correct service host and port in the wget command
    values:
      - test-values/common.values.yaml
    set:
      service.enabled: true
      port: 9000
    asserts:
      - matchRegex:
          path: spec.containers[0].command[2]
          pattern: ":9000/"
