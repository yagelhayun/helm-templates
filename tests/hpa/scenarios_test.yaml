suite: HPA — opt-in, activeRegion suppression, and schema
templates:
  - templates/hpa.yaml
tests:

  # ── Opt-in / render guard ────────────────────────────────────────────────────

  - it: does not render when hpa.enabled is false
    values:
      - ../_shared/common.yaml
    # hpa.enabled=false in common.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: does not render when hpa.enabled is true but activeRegion is set
    values:
      - ../_shared/common.yaml
      - ../_shared/prod.yaml
    set:
      hpa.enabled: true
      # activeRegion=us-east-1 from common.yaml → HPA suppressed
    asserts:
      - hasDocuments:
          count: 0

  - it: does not render when workload.type is DaemonSet even if hpa.enabled is true
    values:
      - ../daemonset/values.yaml
    set:
      hpa.enabled: false
      # schema enforces hpa.enabled: false for DaemonSet; template also guards
    asserts:
      - hasDocuments:
          count: 0

  - it: renders an HPA when hpa.enabled is true and activeRegion is not set
    values:
      - values-no-active-region.yaml
    set:
      hpa.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: HorizontalPodAutoscaler
      - equal:
          path: spec.maxReplicas
          value: 4

  - it: scaleTargetRef points to the correct workload kind and name
    values:
      - values-no-active-region.yaml
    set:
      hpa.enabled: true
    asserts:
      - equal:
          path: spec.scaleTargetRef.kind
          value: Deployment
      - equal:
          path: spec.scaleTargetRef.apiVersion
          value: apps/v1
      - equal:
          path: spec.scaleTargetRef.name
          value: RELEASE-NAME

  - it: metrics list is rendered from hpa.resources
    values:
      - values-no-active-region.yaml
    set:
      hpa.enabled: true
    asserts:
      - contains:
          path: spec.metrics
          content:
            type: Resource
            resource:
              name: cpu
              target:
                type: Utilization
                averageUtilization: 70
      - contains:
          path: spec.metrics
          content:
            type: Resource
            resource:
              name: memory
              target:
                type: Utilization
                averageUtilization: 70

  - it: averageUtilization defaults to 70 when not set
    values:
      - values-no-active-region.yaml
    set:
      hpa.enabled: true
      hpa.resources.cpu: {}
    asserts:
      - contains:
          path: spec.metrics
          content:
            type: Resource
            resource:
              name: cpu
              target:
                type: Utilization
                averageUtilization: 70

  - it: minReplicas matches replicas value
    values:
      - values-no-active-region.yaml
    set:
      hpa.enabled: true
    asserts:
      - equal:
          path: spec.minReplicas
          value: 3

  - it: scaleTargetRef points to StatefulSet when workload.type is StatefulSet
    values:
      - ../statefulset/values.yaml
    set:
      hpa.enabled: true
      hpa.maxReplicas: 6
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: spec.scaleTargetRef.kind
          value: StatefulSet
      - equal:
          path: spec.scaleTargetRef.name
          value: RELEASE-NAME

  # ── Schema validation ────────────────────────────────────────────────────────

  - it: schema rejects hpa.enabled true without maxReplicas
    values:
      - ../_shared/minimal.yaml
    set:
      hpa.enabled: true
    asserts:
      - failedTemplate: {}

  - it: schema rejects maxReplicas of 0
    values:
      - ../_shared/minimal.yaml
    set:
      hpa.enabled: true
      hpa.maxReplicas: 0
    asserts:
      - failedTemplate: {}

  - it: schema rejects averageUtilization above 99
    values:
      - ../_shared/minimal.yaml
    set:
      hpa.enabled: true
      hpa.maxReplicas: 5
      hpa.resources.cpu.averageUtilization: 100
    asserts:
      - failedTemplate: {}

  - it: schema rejects averageUtilization of 0
    values:
      - ../_shared/minimal.yaml
    set:
      hpa.enabled: true
      hpa.maxReplicas: 5
      hpa.resources.cpu.averageUtilization: 0
    asserts:
      - failedTemplate: {}
