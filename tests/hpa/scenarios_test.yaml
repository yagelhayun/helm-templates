suite: HPA — opt-in, activeRegion suppression, and schema
templates:
  - templates/hpa.yaml
tests:

  # ── Opt-in / render guard ────────────────────────────────────────────────────

  - it: does not render when hpa.enabled is false
    values:
      - ../_shared/common.yaml
    # hpa.enabled=false in common.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: does not render when hpa.enabled is true but activeRegion is set
    values:
      - ../_shared/common.yaml
      - ../_shared/prod.yaml
    set:
      hpa.enabled: true
      # activeRegion=us-east-1 from common.yaml → HPA suppressed
    asserts:
      - hasDocuments:
          count: 0

  - it: does not render when workload.type is DaemonSet even if hpa.enabled is true
    values:
      - ../daemonset/values.yaml
    set:
      hpa.enabled: false
      # schema enforces hpa.enabled: false for DaemonSet; template also guards
    asserts:
      - hasDocuments:
          count: 0

  - it: renders an HPA when hpa.enabled is true and activeRegion is not set
    values:
      - ../_shared/common.yaml
      - ../_shared/prod.yaml
    set:
      hpa.enabled: true
      activeRegion: ""
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: HorizontalPodAutoscaler
      - equal:
          path: spec.maxReplicas
          value: 4

  # ── Schema validation ────────────────────────────────────────────────────────

  - it: schema rejects hpa.enabled true without maxReplicas
    values:
      - ../_shared/minimal.yaml
    set:
      hpa.enabled: true
    asserts:
      - failedTemplate: {}

  - it: schema rejects maxReplicas of 0
    values:
      - ../_shared/minimal.yaml
    set:
      hpa.enabled: true
      hpa.maxReplicas: 0
    asserts:
      - failedTemplate: {}

  - it: schema rejects averageUtilization above 99
    values:
      - ../_shared/minimal.yaml
    set:
      hpa.enabled: true
      hpa.maxReplicas: 5
      hpa.resources.cpu.averageUtilization: 100
    asserts:
      - failedTemplate: {}

  - it: schema rejects averageUtilization of 0
    values:
      - ../_shared/minimal.yaml
    set:
      hpa.enabled: true
      hpa.maxReplicas: 5
      hpa.resources.cpu.averageUtilization: 0
    asserts:
      - failedTemplate: {}
