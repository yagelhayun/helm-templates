# No workload type set — used to verify workload templates do not render
# when workload.type is absent.
global:
  region: us-east-1
  ignoreLookup: "true"

ports:
  http:
    port: 8080
replicas: 1
resources:
  cpu: 100m
  memory: 256Mi
image:
  url: myapp

service:
  enabled: false
configMap:
  enabled: false
cronJob:
  enabled: false
hpa:
  enabled: false
