global:
  region: us-east-1
  ignoreLookup: "true"

ports:
  api:
    port: 5000

activeRegion: us-east-1

image:
  url: myrepo/myapp
  pullSecrets:
    - registry-secret

resources:
  cpu: 250m
  memory: 500Mi

replicas: 1

volumes:
  secrets:
    app-secret:
      mountPath: /run/secrets

envFrom:
  secrets:
    app-secret: {}
  configMaps:
    app-config: {}

env:
  secrets:
    feature-config:
      - key: API_TOKEN
        variable: APP_API_TOKEN
  configMaps:
    feature-config:
      - key: DB_HOSTS
        variable: DATABASE_HOSTS

workload:
  type: Deployment

service:
  enabled: true

hpa:
  enabled: false

configMap:
  enabled: true
  data:
    APP_ENV: "staging"
    MAX_CONNECTIONS: "100"
    CRON_EXPR: "0/10 * * * *"
    FEATURE_ENABLED: "true"

regions:
  us-east-1:
    configMap:
      data:
        ENDPOINT: "storage.us-east-1.example.com"
        URL: "sso.us-east-1.example.com"
  us-west-1:
    configMap:
      data:
        ENDPOINT: "storage.us-west-1.example.com"
        URL: "sso.us-west-1.example.com"

probes:
  readiness:
    httpGet:
      path: /health
      scheme: HTTP
  liveness:
    httpGet:
      path: /health
      scheme: HTTP
    failureThreshold: 1
    initialDelaySeconds: 15
    periodSeconds: 15
    successThreshold: 1
    timeoutSeconds: 30
  startup:
    httpGet:
      path: /ready
    failureThreshold: 30
    periodSeconds: 10

initContainers:
  - name: db-migration
    image:
      url: myrepo/migrator
      tag: "1.0"
    command: ["/bin/sh"]
    args: ["-c", "echo running migration"]
    resources:
      cpu: 100m
      memory: 128Mi

sidecars:
  - name: log-shipper
    image:
      url: fluent/fluent-bit
      tag: "2.2"
    ports:
      metrics:
        port: 2020
    resources:
      cpu: 50m
      memory: 64Mi
