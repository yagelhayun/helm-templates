global:
  region: us-east-1
  ignoreLookup: "true"

ports:
  http:
    port: 8080
  metrics:
    port: 9090
    appProtocol: prometheus.io/metrics

primaryPort: http

replicas: 1
resources:
  cpu: 100m
  memory: 256Mi
image:
  url: myapp

workload:
  type: Deployment

service:
  enabled: true
configMap:
  enabled: false
cronJob:
  enabled: false
hpa:
  enabled: false
