global:
  region: us-east-1
  ignoreLookup: "true"

ports:
  api:
    port: 5000
replicas: 3

image:
  url: myrepo/myapp
  tag: v1.0.0

resources:
  cpu: 250m
  memory: 512Mi

workload:
  type: StatefulSet

statefulSet:
  headlessService: myapp-headless
  podManagementPolicy: OrderedReady
  volumeClaimTemplates:
    - name: data
      storageClass: standard
      size: 10Gi
      accessMode: ReadWriteOnce

service:
  enabled: true
configMap:
  enabled: false
hpa:
  enabled: false
