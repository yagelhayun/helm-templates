suite: StatefulSet — opt-in, behavior, and schema
templates:
  - templates/statefulset.yaml
tests:

  # ── Opt-in ───────────────────────────────────────────────────────────────────

  - it: does not render when workload.type is not StatefulSet
    values:
      - ../_shared/common.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: renders a StatefulSet when workload.type is StatefulSet
    values:
      - ./values.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: StatefulSet

  # ── Behavior ─────────────────────────────────────────────────────────────────

  - it: sets serviceName from statefulSet.headlessService
    values:
      - ./values.yaml
    asserts:
      - equal:
          path: spec.serviceName
          value: myapp-headless

  - it: defaults podManagementPolicy to OrderedReady
    values:
      - ./values.yaml
    asserts:
      - equal:
          path: spec.podManagementPolicy
          value: OrderedReady

  - it: uses Parallel podManagementPolicy when configured
    values:
      - ./values.yaml
    set:
      statefulSet.podManagementPolicy: Parallel
    asserts:
      - equal:
          path: spec.podManagementPolicy
          value: Parallel

  - it: defaults updateStrategy to RollingUpdate
    values:
      - ./values.yaml
    asserts:
      - equal:
          path: spec.updateStrategy.type
          value: RollingUpdate

  - it: uses OnDelete updateStrategy when configured via strategy.type
    values:
      - ./values.yaml
    set:
      strategy.type: OnDelete
    asserts:
      - equal:
          path: spec.updateStrategy.type
          value: OnDelete
      - notExists:
          path: spec.updateStrategy.rollingUpdate

  - it: renders partition in updateStrategy when set via strategy.partition
    values:
      - ./values.yaml
    set:
      strategy.partition: 2
    asserts:
      - equal:
          path: spec.updateStrategy.rollingUpdate.partition
          value: 2

  - it: renders volumeClaimTemplates
    values:
      - ./values.yaml
    asserts:
      - equal:
          path: spec.volumeClaimTemplates[0].metadata.name
          value: data
      - equal:
          path: spec.volumeClaimTemplates[0].spec.resources.requests.storage
          value: 10Gi
      - equal:
          path: spec.volumeClaimTemplates[0].spec.accessModes[0]
          value: ReadWriteOnce

  - it: uses 0 replicas when activeRegion does not match
    values:
      - ./values.yaml
    set:
      activeRegion: us-west-1
      global.region: us-east-1
    asserts:
      - equal:
          path: spec.replicas
          value: 0

  - it: defaults revisionHistoryLimit to 1
    values:
      - ./values.yaml
    asserts:
      - equal:
          path: spec.revisionHistoryLimit
          value: 1

  # ── Schema validation ────────────────────────────────────────────────────────

  - it: schema rejects StatefulSet workload without statefulSet block
    values:
      - ../_shared/minimal.yaml
    set:
      workload.type: StatefulSet
    asserts:
      - failedTemplate: {}

  - it: schema rejects empty statefulSet.headlessService
    values:
      - ./values.yaml
    set:
      statefulSet.headlessService: ""
    asserts:
      - failedTemplate: {}

  - it: schema rejects invalid podManagementPolicy
    values:
      - ./values.yaml
    set:
      statefulSet.podManagementPolicy: Random
    asserts:
      - failedTemplate: {}

  - it: schema rejects volumeClaimTemplate without name
    values:
      - ../_shared/minimal.yaml
    set:
      workload.type: StatefulSet
      statefulSet.headlessService: myapp-headless
      statefulSet.volumeClaimTemplates[0].size: 10Gi
    asserts:
      - failedTemplate: {}

  - it: schema rejects volumeClaimTemplate without size
    values:
      - ../_shared/minimal.yaml
    set:
      workload.type: StatefulSet
      statefulSet.headlessService: myapp-headless
      statefulSet.volumeClaimTemplates[0].name: data
    asserts:
      - failedTemplate: {}

  - it: schema rejects invalid accessMode in volumeClaimTemplate
    values:
      - ./values.yaml
    set:
      statefulSet.volumeClaimTemplates[0].accessMode: ReadOnly
    asserts:
      - failedTemplate: {}
