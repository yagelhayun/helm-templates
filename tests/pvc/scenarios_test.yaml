suite: PersistentVolumeClaim — rendering and pod volume mounting
tests:

  # ── PVC resource ─────────────────────────────────────────────────────────────

  - it: renders a PVC with required fields
    templates:
      - templates/pvc.yaml
    values:
      - ../_shared/minimal.yaml
    set:
      persistentVolumeClaims.my-data.size: 10Gi
    asserts:
      - isKind:
          of: PersistentVolumeClaim

  - it: uses configured storage size
    templates:
      - templates/pvc.yaml
    values:
      - ../_shared/minimal.yaml
    set:
      persistentVolumeClaims.my-data.size: 10Gi
    asserts:
      - equal:
          path: spec.resources.requests.storage
          value: 10Gi

  - it: defaults accessMode to ReadWriteOnce
    templates:
      - templates/pvc.yaml
    values:
      - ../_shared/minimal.yaml
    set:
      persistentVolumeClaims.my-data.size: 10Gi
    asserts:
      - contains:
          path: spec.accessModes
          content: ReadWriteOnce

  - it: uses configured accessMode
    templates:
      - templates/pvc.yaml
    values:
      - ../_shared/minimal.yaml
    set:
      persistentVolumeClaims.my-data.size: 10Gi
      persistentVolumeClaims.my-data.accessMode: ReadWriteMany
    asserts:
      - contains:
          path: spec.accessModes
          content: ReadWriteMany

  - it: includes storageClass when configured
    templates:
      - templates/pvc.yaml
    values:
      - ../_shared/minimal.yaml
    set:
      persistentVolumeClaims.my-data.size: 10Gi
      persistentVolumeClaims.my-data.storageClass: fast-ssd
    asserts:
      - equal:
          path: spec.storageClassName
          value: fast-ssd

  - it: omits storageClass when not configured
    templates:
      - templates/pvc.yaml
    values:
      - ../_shared/minimal.yaml
    set:
      persistentVolumeClaims.my-data.size: 10Gi
    asserts:
      - notExists:
          path: spec.storageClassName

  - it: renders no documents when persistentVolumeClaims is not set
    templates:
      - templates/pvc.yaml
    values:
      - ../_shared/minimal.yaml
    asserts:
      - hasDocuments:
          count: 0

  # ── Pod volume mounting ───────────────────────────────────────────────────────

  - it: pod spec includes persistentVolumeClaim volume
    templates:
      - templates/deployment.yaml
    values:
      - ../_shared/minimal.yaml
    set:
      global.ignoreLookup: "true"
      volumes.pvcs.my-data.mountPath: /data
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: my-data
            persistentVolumeClaim:
              claimName: my-data

  - it: pod spec includes readOnly persistentVolumeClaim volume
    templates:
      - templates/deployment.yaml
    values:
      - ../_shared/minimal.yaml
    set:
      global.ignoreLookup: "true"
      volumes.pvcs.my-data.mountPath: /data
      volumes.pvcs.my-data.readOnly: true
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: my-data
            persistentVolumeClaim:
              claimName: my-data
              readOnly: true

  - it: pod spec includes volumeMount for persistentVolumeClaim
    templates:
      - templates/deployment.yaml
    values:
      - ../_shared/minimal.yaml
    set:
      global.ignoreLookup: "true"
      volumes.pvcs.my-data.mountPath: /data
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: my-data
            mountPath: /data

  # ── Schema validation ────────────────────────────────────────────────────────

  - it: schema rejects PVC without size
    templates:
      - templates/pvc.yaml
    values:
      - ../_shared/minimal.yaml
    set:
      persistentVolumeClaims.my-data.storageClass: fast-ssd
    asserts:
      - failedTemplate: {}

  - it: schema rejects invalid accessMode in PVC
    templates:
      - templates/pvc.yaml
    values:
      - ../_shared/minimal.yaml
    set:
      persistentVolumeClaims.my-data.size: 10Gi
      persistentVolumeClaims.my-data.accessMode: ReadOnly
    asserts:
      - failedTemplate: {}

  - it: schema rejects pvcVolumeMount without mountPath
    templates:
      - templates/deployment.yaml
    values:
      - ../_shared/minimal.yaml
    set:
      global.ignoreLookup: "true"
      volumes.pvcs.my-data.readOnly: true
    asserts:
      - failedTemplate: {}
