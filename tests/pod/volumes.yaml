global:
  region: us-east-1
  ignoreLookup: "true"

ports:
  http:
    port: 8080
replicas: 1
resources:
  cpu: 100m
  memory: 256Mi
image:
  url: myapp

workload:
  type: Deployment

service:
  enabled: false
configMap:
  enabled: false
cronJob:
  enabled: false
hpa:
  enabled: false

volumes:
  emptyDirs:
    tmp-data:
      mountPath: /tmp/data
  pvcs:
    my-pvc:
      mountPath: /data
  hostPaths:
    host-logs:
      hostPath: /var/log
      mountPath: /host/log
      type: Directory

hostAliases:
  - ip: "192.168.1.100"
    hostnames:
      - "foo.local"
      - "bar.local"
