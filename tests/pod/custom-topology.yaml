global:
  region: us-east-1
  ignoreLookup: "true"

port: 8080
replicas: 1
resources:
  cpu: 100m
  memory: 256Mi
image:
  url: myapp

workload:
  type: Deployment
service:
  enabled: false
configMap:
  enabled: false
cronJob:
  enabled: false
hpa:
  enabled: false

topologySpreadConstraints:
  - maxSkew: 2
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
