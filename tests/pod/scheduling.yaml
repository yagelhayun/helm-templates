global:
  region: us-east-1
  ignoreLookup: "true"

ports:
  http:
    port: 8080
replicas: 1
resources:
  cpu: 100m
  memory: 256Mi
image:
  repository: myapp

workload:
  type: Deployment

service:
  enabled: false
configMap:
  enabled: false
hpa:
  enabled: false

nodeSelector:
  disktype: ssd

tolerations:
  - key: dedicated
    operator: Equal
    value: gpu
    effect: NoSchedule
  - key: not-ready
    operator: Exists
    effect: NoExecute
    tolerationSeconds: 300

affinity:
  nodeAffinity:
    required:
      - key: topology.kubernetes.io/zone
        operator: In
        values:
          - us-east-1a
    preferred:
      - weight: 50
        key: kubernetes.io/arch
        operator: In
        values:
          - amd64
  podAntiAffinity:
    preferred:
      - weight: 100
        topologyKey: kubernetes.io/hostname
    required:
      - topologyKey: topology.kubernetes.io/zone

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 2000
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

priorityClassName: high-priority
