suite: PodDisruptionBudget — opt-in, configuration, and schema
templates:
  - templates/pdb.yaml
tests:

  # ── Opt-in ───────────────────────────────────────────────────────────────────

  - it: renders PodDisruptionBudget when enabled is true
    values:
      - ../_shared/minimal.yaml
    set:
      pdb.enabled: true
      pdb.maxUnavailable: 1
    asserts:
      - isKind:
          of: PodDisruptionBudget

  - it: does not render PodDisruptionBudget when disabled
    values:
      - ../_shared/minimal.yaml
    asserts:
      - hasDocuments:
          count: 0

  # ── Behavior ─────────────────────────────────────────────────────────────────

  - it: uses maxUnavailable when configured
    values:
      - ../_shared/minimal.yaml
    set:
      pdb.enabled: true
      pdb.maxUnavailable: 1
    asserts:
      - equal:
          path: spec.maxUnavailable
          value: 1
      - notExists:
          path: spec.minAvailable

  - it: uses minAvailable when configured
    values:
      - ../_shared/minimal.yaml
    set:
      pdb.enabled: true
      pdb.minAvailable: 2
    asserts:
      - equal:
          path: spec.minAvailable
          value: 2
      - notExists:
          path: spec.maxUnavailable

  - it: prefers minAvailable over maxUnavailable when both are set
    values:
      - ../_shared/minimal.yaml
    set:
      pdb.enabled: true
      pdb.minAvailable: 1
      pdb.maxUnavailable: 1
    asserts:
      - exists:
          path: spec.minAvailable
      - notExists:
          path: spec.maxUnavailable

  - it: selector uses selectorLabels only (no helm.sh/chart)
    values:
      - ../_shared/minimal.yaml
    set:
      pdb.enabled: true
      pdb.maxUnavailable: 1
    asserts:
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/name"]
          value: templates
      - notExists:
          path: spec.selector.matchLabels["helm.sh/chart"]

  # ── Schema validation ────────────────────────────────────────────────────────

  - it: schema rejects pdb.enabled true without minAvailable or maxUnavailable
    values:
      - ../_shared/minimal.yaml
    set:
      pdb.enabled: true
    asserts:
      - failedTemplate: {}
