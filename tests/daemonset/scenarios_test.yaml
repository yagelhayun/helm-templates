suite: DaemonSet — opt-in, behavior, and schema
templates:
  - templates/daemonset.yaml
tests:

  # ── Opt-in ───────────────────────────────────────────────────────────────────

  - it: does not render when workload.type is not DaemonSet
    values:
      - ../_shared/common.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: renders a DaemonSet when workload.type is DaemonSet
    values:
      - ./values.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: DaemonSet

  # ── Behavior ─────────────────────────────────────────────────────────────────

  - it: does not have a replicas field
    values:
      - ./values.yaml
    asserts:
      - notExists:
          path: spec.replicas

  - it: defaults updateStrategy to RollingUpdate
    values:
      - ./values.yaml
    asserts:
      - equal:
          path: spec.updateStrategy.type
          value: RollingUpdate

  - it: defaults updateStrategy maxUnavailable to 25%
    values:
      - ./values.yaml
    asserts:
      - equal:
          path: spec.updateStrategy.rollingUpdate.maxUnavailable
          value: "25%"

  - it: uses OnDelete updateStrategy when configured
    values:
      - ./values.yaml
    set:
      strategy.type: OnDelete
    asserts:
      - equal:
          path: spec.updateStrategy.type
          value: OnDelete
      - notExists:
          path: spec.updateStrategy.rollingUpdate

  - it: renders the container with the correct image
    values:
      - ./values.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: myrepo/node-agent:v1.0.0

  - it: renders the container port
    values:
      - ./values.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 9100

  # ── Schema validation ────────────────────────────────────────────────────────

  - it: schema rejects hpa.enabled true for DaemonSet workload
    values:
      - ./values.yaml
    set:
      hpa.enabled: true
      hpa.maxReplicas: 5
    asserts:
      - failedTemplate: {}
