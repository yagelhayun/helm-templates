suite: cronJob — type-based opt-in, configuration, and schema
templates:
  - templates/cronjob.yaml
tests:

  # ── Opt-in ───────────────────────────────────────────────────────────────────

  - it: does not render when workload.type is Deployment
    values:
      - ../_shared/minimal.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: renders a CronJob when workload.type is CronJob
    values:
      - ../_shared/cronjob.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: CronJob

  # ── Behavior ─────────────────────────────────────────────────────────────────

  - it: uses the configured schedule
    values:
      - ../_shared/cronjob.yaml
    asserts:
      - equal:
          path: spec.schedule
          value: "@hourly"

  - it: defaults concurrencyPolicy to Forbid when not set
    values:
      - ../_shared/minimal.yaml
    set:
      workload.type: CronJob
      cronJob.schedule: "0 * * * *"
    asserts:
      - equal:
          path: spec.concurrencyPolicy
          value: Forbid

  - it: defaults suspend to false when not set
    values:
      - ../_shared/cronjob.yaml
    asserts:
      - equal:
          path: spec.suspend
          value: false

  - it: sets suspend to true when configured
    values:
      - ../_shared/cronjob.yaml
    set:
      cronJob.suspend: true
    asserts:
      - equal:
          path: spec.suspend
          value: true

  # ── Schema validation ────────────────────────────────────────────────────────

  - it: schema rejects non-boolean suspend
    values:
      - ../_shared/minimal.yaml
    set:
      workload.type: CronJob
      cronJob.schedule: "0 * * * *"
      cronJob.suspend: "yes"
    asserts:
      - failedTemplate: {}

  - it: accepts a standard 5-field schedule
    values:
      - ../_shared/minimal.yaml
    set:
      workload.type: CronJob
      cronJob.schedule: "0 2 * * 1-5"
    asserts:
      - hasDocuments:
          count: 1

  - it: accepts @hourly macro
    values:
      - ../_shared/minimal.yaml
    set:
      workload.type: CronJob
      cronJob.schedule: "@hourly"
    asserts:
      - hasDocuments:
          count: 1

  - it: schema rejects a 6-field schedule (year not supported)
    values:
      - ../_shared/minimal.yaml
    set:
      workload.type: CronJob
      cronJob.schedule: "0 0 * * * 2025"
    asserts:
      - failedTemplate: {}

  - it: schema rejects an invalid schedule string
    values:
      - ../_shared/minimal.yaml
    set:
      workload.type: CronJob
      cronJob.schedule: "not-a-cron"
    asserts:
      - failedTemplate: {}

  - it: schema rejects unknown @ macro
    values:
      - ../_shared/minimal.yaml
    set:
      workload.type: CronJob
      cronJob.schedule: "@reboot"
    asserts:
      - failedTemplate: {}

  - it: schema rejects CronJob type without cronJob block
    values:
      - ../_shared/minimal.yaml
    set:
      workload.type: CronJob
    asserts:
      - failedTemplate: {}

  - it: schema rejects invalid concurrencyPolicy
    values:
      - ../_shared/minimal.yaml
    set:
      workload.type: CronJob
      cronJob.schedule: "0 * * * *"
      cronJob.concurrencyPolicy: Invalid
    asserts:
      - failedTemplate: {}

  - it: schema rejects negative successfulJobsHistory
    values:
      - ../_shared/minimal.yaml
    set:
      workload.type: CronJob
      cronJob.schedule: "0 * * * *"
      cronJob.successfulJobsHistory: -1
    asserts:
      - failedTemplate: {}

  - it: schema rejects negative failedJobsHistory
    values:
      - ../_shared/minimal.yaml
    set:
      workload.type: CronJob
      cronJob.schedule: "0 * * * *"
      cronJob.failedJobsHistory: -1
    asserts:
      - failedTemplate: {}

  - it: schema rejects HPA enabled for CronJob
    values:
      - ../_shared/minimal.yaml
    set:
      workload.type: CronJob
      cronJob.schedule: "0 * * * *"
      hpa.enabled: true
    asserts:
      - failedTemplate: {}
