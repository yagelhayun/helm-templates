revisionHistoryLimit: 1

terminationGracePeriodSeconds: 30

pdb:
  enabled: false
  maxUnavailable: 1

hpa:
  enabled: false

# RollingUpdate is the default type. Set type: Recreate to terminate all pods
# before starting new ones (required when ReadWriteOnce volumes are in use).
# maxUnavailable: 0 + maxSurge: 1 gives zero-downtime at the cost of extra capacity.
# maxSurge: 0 + maxUnavailable: 1 limits resource usage at the cost of brief unavailability.
strategy:
  type: RollingUpdate
  maxUnavailable: "25%"
  maxSurge: "25%"

# Spread pods across nodes and zones so the workload survives a node or
# AZ failure. ScheduleAnyway is a soft constraint — scheduling is never
# blocked on clusters that are too small or single-zone.
# Set to [] to disable topology spreading entirely.
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway
