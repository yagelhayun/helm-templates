name: Test Helm Templates

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'
  workflow_call:

jobs:
  lint-and-template:
    name: Lint and Template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build dependencies
        run: helm dependency build

      - name: Lint (validates chart structure and JSON schema)
        run: >-
          helm lint .
          -f test-values/common.values.yaml
          -f test-values/prod.values.yaml

      - name: Template (renders all manifests against test values)
        run: >-
          helm template my-service .
          -f test-values/common.values.yaml
          -f test-values/prod.values.yaml

      - name: Install helm-unittest
        run: helm plugin install https://github.com/helm-unittest/helm-unittest --verify=false

      - name: Run unit tests
        run: helm unittest -f 'unit-tests/*_test.yaml' .
