name: Test Helm Templates

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'
  workflow_call:

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build dependencies
        run: helm dependency build

      - name: Lint (validates chart structure and JSON schema)
        run: >-
          helm lint $GITHUB_WORKSPACE
          -f $GITHUB_WORKSPACE/tests/_shared/common.yaml
          -f $GITHUB_WORKSPACE/tests/_shared/prod.yaml

      - name: Install helm-unittest
        run: helm plugin install https://github.com/helm-unittest/helm-unittest --verify=false

      - name: Run unit tests
        run: helm unittest -f 'tests/**/*_test.yaml' .
