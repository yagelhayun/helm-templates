global:
  region: us-east-1
  ignoreLookup: "true"

port: 5000
portName: api

activeRegion: us-east-1

image:
  url: test
  pullSecrets:
    - my-registry-secret

resources:
  cpu: 250m
  memory: 500Mi

replicas: 1

volumes:
  secrets:
    fire-devops-push:
      mountPath: /

envFrom:
  secrets:
    fire-devops-push: {}
  configMaps:
    fire-devops-push: {}
  # kaki:
  #   zorem: {}

env:
  secrets:
    devops-switchover:
      - key: PORTAL_API_TOKEN
        variable: test1
  configMaps:
    devops-switchover:
      - key: DB_IDS
        variable: test2

deployment:
  enabled: true

service:
  enabled: true

cronJob:
  enabled: true
  schedule: "@hourly"
  concurrencyPolicy: Allow
  successfulJobsHistory: 4
  failedJobsHistory: 5
  entrypoint:
    command:
      - "/bin/bash"
    args:
      - "echo hello"

hpa:
  enabled: false

configMap:
  enabled: true
  data:
    DQ_STRING: "VALUE"
    NUMBER: "4565"
    SQ_STRING: '0/10 * * * *'
    BOOLEAN: "true"

regions:
  us-east-1:
    configMap:
      data:
        ENDPOINT: "storage.us-east-1.com"
        URL: "sso.us-east-1.com"
  us-west-1:
    configMap:
      data:
        ENDPOINT: "storage.us-west-1.com"
        URL: "sso.us-west-1.com"

probes:
  readiness:
    httpGet:
      path: /whoami
      port: 3000
      scheme: HTTP
  liveness:
    httpGet:
      path: /whoami
      port: 3000
      scheme: HTTP
    failureThreshold: 1
    initialDelaySeconds: 15
    periodSeconds: 15
    successThreshold: 1
    timeoutSeconds: 30
  startup:
    httpGet:
      path: /health
      port: 3000
    failureThreshold: 30
    periodSeconds: 10

initContainers:
  - name: db-migration
    image:
      url: myrepo/migrator
      tag: "1.0"
    command: ["/bin/sh"]
    args: ["-c", "echo running migration"]
    resources:
      cpu: 100m
      memory: 128Mi

sidecars:
  - name: log-shipper
    image:
      url: fluent/fluent-bit
      tag: "2.2"
    port: 2020
    portName: metrics
    resources:
      cpu: 50m
      memory: 64Mi
