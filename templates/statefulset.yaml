{{- if eq (.Values.workload).type "StatefulSet" }}
{{- $config := include "core.general.config" . | fromYaml }}
{{- $context := merge (dict "$" $) $config }}
kind: StatefulSet
apiVersion: apps/v1
metadata:
  name: {{ include "core.statefulset.name" $context }}
  labels:
    {{- include "core.statefulset.labels" $context | nindent 4 }}
    {{- with $config.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with ($config.annotations).statefulSet }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ include "core.common.replicas" $context }}
  selector:
    matchLabels: {{ include "core.common.labels" $context | nindent 6 }}
  serviceName: {{ $config.statefulSet.serviceName }}
  podManagementPolicy: {{ ($config.statefulSet).podManagementPolicy | default "OrderedReady" }}
  updateStrategy: {{ include "core.common.strategy" $context | nindent 4 }}
  revisionHistoryLimit: {{ ternary 1 (int $config.revisionHistoryLimit) (kindIs "invalid" $config.revisionHistoryLimit) }}
  template:
    metadata:
      labels: {{ include "core.common.labels" $context | nindent 8 }}
      {{- with (include "core.pod.annotations" $context) }}
      annotations: {{ . | indent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ $config.serviceAccount | default "default" }}
      {{- with (include "core.pod.imagePullSecrets" $context) }}
      imagePullSecrets: {{ . | indent 6 }}
      {{- end }}
      {{- with (include "core.pod.volumes" $context) }}
      volumes: {{ . | indent 6 }}
      {{- end }}
      {{- with (include "core.pod.initContainers" $context) }}
      initContainers: {{ . | indent 6 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ ternary 30 (int $config.terminationGracePeriodSeconds) (kindIs "invalid" $config.terminationGracePeriodSeconds) }}
      {{- with (include "core.pod.topologySpreadConstraints" $context) }}
      topologySpreadConstraints: {{ . | indent 6 }}
      {{- end }}
      containers:
        {{- include "core.container.render" $context | indent 8 }}
        {{- with (include "core.container.sidecars" $context) }}
        {{- . | indent 8 }}
        {{- end }}
  {{- with (include "core.pod.volumeClaimTemplates" $context) }}
  volumeClaimTemplates: {{ . | indent 4 }}
  {{- end }}
{{- end }}
